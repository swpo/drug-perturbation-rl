[project]
name = "phenotype-process-judge"
version = "0.1.0"
description = "Offline process-coherence audit environment for phenotype reasoning traces"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.14.0",
    "verifiers>=0.1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phenotype_process_judge"]
