# Matched v0.10-lineage 35B on-policy control for the v0.27 strategy judge.
# Four direct one-link tasks are sampled equally through three env replicas.
# Gemini judges every trace, but the shadow lane trains on deterministic reward.

name = "bioreasoning-phenotype-taskmix-judge-v027-v0103-qwen35b-a3b-shadow-50step"
env_files = ["secrets.env"]

model = "Qwen/Qwen3.5-35B-A3B"
max_steps = 50
batch_size = 256
rollouts_per_example = 8

[sampling]
max_tokens = 16384

[[env]]
id = "abugoot/bioreasoning_phenotype@0.10.3"
name = "identity_mechanism_shadow"
ratio = 0.50

[env.args]
entry_points = ["target_from_smiles", "moa_from_target"]
num_eval_examples = 64
tools = true
hallmark_tools = false
max_tool_turns = 5
strategy_judge_mode = "shadow"
strategy_judge_model = "google/gemini-3-flash-preview"
strategy_judge_base_url = "https://api.pinference.ai/api/v1"
strategy_judge_api_key_var = "PRIME_API_KEY"
strategy_judge_concurrency = 32
strategy_judge_max_tokens = 600
strategy_judge_max_retries = 2
strategy_judge_timeout_seconds = 180.0

[[env]]
id = "abugoot/bioreasoning_phenotype@0.10.3"
name = "pathways_from_moa_shadow"
ratio = 0.25

[env.args]
entry_points = ["pathways_from_moa"]
num_eval_examples = 64
tools = true
hallmark_tools = false
max_tool_turns = 5
strategy_judge_mode = "shadow"
strategy_judge_model = "google/gemini-3-flash-preview"
strategy_judge_base_url = "https://api.pinference.ai/api/v1"
strategy_judge_api_key_var = "PRIME_API_KEY"
strategy_judge_concurrency = 32
strategy_judge_max_tokens = 600
strategy_judge_max_retries = 2
strategy_judge_timeout_seconds = 180.0

[[env]]
id = "abugoot/bioreasoning_phenotype@0.10.3"
name = "phenotype_from_pathways_shadow"
ratio = 0.25

[env.args]
entry_points = ["phenotype_from_pathways"]
phenotypes = ["viability", "cell_cycle", "stress"]
num_eval_examples = 64
tools = true
hallmark_tools = false
max_tool_turns = 5
strategy_judge_mode = "shadow"
strategy_judge_model = "google/gemini-3-flash-preview"
strategy_judge_base_url = "https://api.pinference.ai/api/v1"
strategy_judge_api_key_var = "PRIME_API_KEY"
strategy_judge_concurrency = 32
strategy_judge_max_tokens = 600
strategy_judge_max_retries = 2
strategy_judge_timeout_seconds = 180.0

[[pre_batch_filters]]
type = "gibberish"
enforce = false
token_id_threshold = 100000
logprob_offset = 2.0

[[pre_batch_filters]]
type = "repetition"
enforce = false
window = 3000
prob_threshold = 0.99

[[pre_batch_filters]]
type = "zero_advantage"
enforce = false

[[post_batch_filters]]
type = "gibberish"
enforce = false
token_id_threshold = 100000
logprob_offset = 2.0

[[post_batch_filters]]
type = "repetition"
enforce = false
window = 3000
prob_threshold = 0.99

[[post_batch_filters]]
type = "zero_advantage"
enforce = true

[wandb]
project = "bioreasoning_rl_prime"
name = "qwen3.5-35b-a3b-taskmix-judge-v027-v0103-shadow-50step"
entity = "abugootlab"

[val]
num_examples = 64
rollouts_per_example = 1
interval = 5
