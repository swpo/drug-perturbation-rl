[project]
name = "bioreasoning_phenotype"
description = "Multi-step pharmacology reasoning chain: predict target → MoA → pathways+direction → one phenotype (viability/cell_cycle/stress/magnitude) across the LINCS L1000 + PRISM + DRH substrate."
tags = ["biology", "small-molecule", "lincs", "l1000", "prism", "chain-of-thought", "rl"]
version = "0.10.4"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.14",
    # Used only for the Dataset wrapper around the local parquet; no Hub API calls at runtime.
    "datasets>=2.14.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    # rdkit needed at runtime for the identify_compound tool (canonicalization,
    # fingerprints, descriptors). Heavy but the model needs it to be useful.
    "rdkit>=2024.3.1",
    # The optional on-policy strategy judge calls Prime's OpenAI-compatible
    # inference endpoint from the reward function.
    "openai>=1.0",
]

[project.optional-dependencies]
# Data-prep dependencies — needed only for scripts/, not for env runtime.
data-prep = [
    "requests>=2.31",
    "scipy>=1.11",
    "numpy>=1.26",
    "h5py>=3.10",          # for reading L1000 GCTX files
    "cmapPy>=4.0.1",       # canonical GCTX reader
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "bioreasoning_phenotype",
    "judges/phenotype_strategy_judge/phenotype_strategy_judge",
    "judges/phenotype_process_judge/phenotype_process_judge",
]

[tool.hatch.build.force-include]
"bioreasoning_phenotype/data/smallmol_chain_examples.parquet" = "bioreasoning_phenotype/data/smallmol_chain_examples.parquet"
"bioreasoning_phenotype/data/compound_table.parquet" = "bioreasoning_phenotype/data/compound_table.parquet"
"bioreasoning_phenotype/data/hallmarks.json" = "bioreasoning_phenotype/data/hallmarks.json"
